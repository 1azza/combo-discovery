[meta]
project = "combo-discovery"
model = "openrouter/z-ai/glm-5.3-flash"
policy_version = "default-v1"

[engine]
forge_commit = "4f577da7b2a9074f9f66544aaf99405e38cf5ac3"
proto_version = 7

[defaults]
max_turns = 0
timeout_seconds = 0
n_workers = 8
# The default local dev harness listens on 50051 (see ARCHITECTURE.md);
# spawn_servers-based pools use base_port..base_port+n-1 instead.
base_port = 50051
# Single shared experiment/corpus database for every tool (TUI, importer,
# ontology builder).
db_path = "research.db"
