[project]
name = "combo-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Larry Rennoldson", email = "rennoldsonlarry@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.1",
    "ijson>=3.5.1",
    "protobuf>=7.36.1",
    "textual>=8.2.8",
]

[project.scripts]
combo-tui = "combo_discovery.tui.app:main"
combo-import-cards = "combo_discovery.corpus.__main__:main"
combo-build-ontology = "combo_discovery.ontology.__main__:main"
combo-import-spellbook = "combo_discovery.corpus.spellbook_main:main"
combo-evaluate = "combo_discovery.evaluation:main"
combo-analyze-motifs = "combo_discovery.analysis.enrichment:main"
combo-witness = "combo_discovery.witness:main"
combo-web = "combo_discovery.web.__main__:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
# 100 is wide enough for the research scripts' f-strings without a repo-wide reflow.
line-length = 100
# requires-python is >=3.14 and the venv is 3.14; ruff supports py314.
target-version = "py314"
# Machine-generated protobuf stubs: excluded from all lint rules.
extend-exclude = ["src/combo_discovery/generated"]

[tool.ruff.lint]
# Baseline that catches real defects (F: pyflakes; E/W: pycodestyle; B: bugbear;
# I: import order; UP: pyupgrade; C4: comprehensions) without style churn.
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS asset strings: their lines are the asset's own formatting,
# not Python code, so wrapping them would only obfuscate the stylesheet.
"src/combo_discovery/web/assets.py" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "live: requires a running forge-harness server; only runs when FORGE_TEST_HARNESS is set (host:port)",
]
