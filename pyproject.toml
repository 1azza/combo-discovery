[project]
name = "combo-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Larry Rennoldson", email = "rennoldsonlarry@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.1",
    "ijson>=3.5.1",
    "protobuf>=7.36.1",
    "textual>=8.2.8",
]

[project.scripts]
combo-tui = "combo_discovery.tui.app:main"
combo-import-cards = "combo_discovery.corpus.__main__:main"
combo-build-ontology = "combo_discovery.ontology.__main__:main"
combo-import-spellbook = "combo_discovery.corpus.spellbook_main:main"
combo-evaluate = "combo_discovery.evaluation:main"
combo-analyze-motifs = "combo_discovery.analysis.enrichment:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
    "live: requires a running forge-harness server; only runs when FORGE_TEST_HARNESS is set (host:port)",
]
