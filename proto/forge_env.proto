// ForgeEnv gRPC contract — v7 (scenario injection, for witness search).
// Canonical copy lives in the Python repo: combo-discovery/proto/forge_env.proto.
// The Java harness mirrors it at forge-harness/src/main/proto/forge_env.proto.
//
// Message conventions:
//  - All ints are 0-indexed player slots unless noted.
//  - Card identity: Forge card id (int32, stable within a game) + card name.
//  - Determinism: same (decks, seed, config) MUST yield byte-identical event streams.
//
// v6 changes on top of v5 (see PLUMBING_SPEC.md section 3):
//  - Events are normalized: GameEvent.type uses the fixed research vocabulary
//    (CardDrawn, LandPlayed, SpellCast, SpellResolved, PermanentEntered,
//    PermanentLeftBattlefield, CardTapped, CardCounters, PlayerCounters,
//    AttachmentMoved, ManaProduced, ManaSpent, LifeChanged, PlayerDamaged,
//    CardDamaged, AttackersDeclared, BlockersDeclared, TriggerOrdered,
//    TurnStarted, Phase, Shuffled, Scry, Surveil, Mulligan,
//    SnapshotRestored, DecisionTimeout, DecisionGap, GameOver) built from the
//    engine's structured GameEvent records — the substring-matching of log
//    text is gone. Raw log text is preserved in detail_raw.
//  - GameEvent gains card_id (0 = N/A), old_value/new_value (counter/life
//    deltas), and extra (zone names, sa/target descriptions, mode text).
//  - FullState v2: typed per-player mana pools, stack entries, exile and
//    command zones, and hidden-info redaction via GameQuery.view_as_player
//    (0 = observer: others' hands/libraries are counts only).
//  - Permanent gains typed counters and damage.
//  - protocol_version is now 6.
//
// v7 changes on top of v6 (see docs/WITNESS_SEARCH.md):
//  - SetupScenario injects a pre-configured board state (life, mana, and the
//    battlefield/hand/graveyard/library/exile contents with tapped /
//    summoning-sick / counters / damage) into a RUNNING game. It requires a
//    LIVE outstanding decision (the engine thread is parked, so the state is
//    quiescent); it invalidates that decision, so the client MUST refetch via
//    GetDecision afterwards (the sink completes with a SCENARIO_APPLIED
//    sentinel, handled like RESTORED). Injection consumes no RNG and is
//    deterministic for a fixed scenario + seed; a deterministic
//    `ScenarioInjected` event is appended and the scenario hash is folded into
//    `state_hash`. Library list order is the library order (top first).
//  - protocol_version is now 7.

syntax = "proto3";
package forgeenv;

option java_package = "forge.harness.proto";
option java_multiple_files = true;

service ForgeEnv {
  // Start a new game. Fails with FAILED_PRECONDITION if a game is already active (stop it first).
  rpc StartGame(StartRequest) returns (StartResponse);
  // Block until the acting player of this game has a decision pending, then return options.
  rpc GetDecision(GameQuery) returns (DecisionRequest);
  // Submit the acting player's choice; engine advances until next decision or game end.
  rpc SubmitDecision(DecisionSubmit) returns (StepResult);
  // Full state inspection of current game. view_as_player selects the
// hidden-info view: 0 = observer (others' hands/libraries are counts only),
// else the given player slot (their hand visible to them).
  rpc GetState(GameViewQuery) returns (FullState);
  // Poll events with seq > cursor. cursor=0 returns from the first event.
  rpc PollEvents(PollRequest) returns (EventBatch);
  // MCTS support: opaque in-process state tokens. Snapshot requires an
  // outstanding decision (engine parked). Tokens are game-scoped, die with
  // the game, max 32 live per game.
  rpc Snapshot(GameQuery) returns (SnapshotResponse);
  rpc Restore(RestoreRequest) returns (Empty);
  // Inject a pre-configured board state (witness search). Requires a LIVE
  // outstanding decision; invalidates it (client must refetch GetDecision).
  rpc SetupScenario(SetupScenarioRequest) returns (SetupScenarioResponse);
  // Query game-over status without stepping.
  rpc IsGameOver(GameQuery) returns (GameOver);
  // Stop the game, release resources, and drop its event buffer.
  rpc StopGame(GameQuery) returns (Empty);
  // Health / version.
  rpc Ping(Empty) returns (Pong);
}

message Empty {}

message Pong {
  string version = 1;
  bool game_active = 2;
  int32 protocol_version = 3;  // 7 for this contract
}

message DeckSpec {
  string name = 1;
  string path = 2;          // path to .dck file
}

message StartRequest {
  repeated DeckSpec decks = 1;       // 2 players for M1
  int64 seed = 2;
  repeated PlayerType player_types = 3;  // one per deck, same order; exactly len(decks) entries
  int32 max_turns = 4;               // 0 = unlimited; game ends as draw beyond this
  int32 timeout_seconds = 5;         // per-game wall clock, 0 = no watchdog
  // Worker recovery: when true, stop any active game first instead of failing
  // with FAILED_PRECONDITION. Additive in v3; wire-compatible.
  bool force_stop_active = 6;
}

enum PlayerType {
  PLAYER_TYPE_UNSPECIFIED = 0;
  PLAYER_TYPE_REMOTE = 1;      // decisions via GetDecision/SubmitDecision
  PLAYER_TYPE_GOLDFISH = 2;    // dumb scripted: AI defaults, empty priority
  PLAYER_TYPE_FORGE_AI = 3;    // built-in AI
}

message StartResponse {
  int64 game_id = 1;                 // server-assigned, monotonic per harness process
  repeated int32 starting_life = 2;  // per player
}

message GameQuery {
  int64 game_id = 1;
}

// GetState query with hidden-info selection. view_as_player = 0 means the
// observer view; any other slot means that player's private info is visible.
message GameViewQuery {
  int64 game_id = 1;
  int32 view_as_player = 2;         // 0 = observer
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_WIN = 1;          // a player won; see GameOver.winner
  OUTCOME_DRAW = 2;         // rules draw
  OUTCOME_TURN_LIMIT = 3;   // max_turns reached
  OUTCOME_TIMEOUT = 4;      // wall-clock watchdog fired
  OUTCOME_ERROR = 5;        // engine error aborted the game
  OUTCOME_STOPPED = 6;      // stopped via StopGame
}

// The class of the outstanding decision. Drives which payload fields of
// DecisionRequest are populated and which oneof arm of DecisionSubmit.answer
// is accepted.
enum DecisionType {
  DECISION_TYPE_UNSPECIFIED = 0;
  // Playable spell/ability list; answer = option_id (options field).
  DECISION_TYPE_PRIORITY = 1;
  // London mulligan: keep the hand? answer = boolean_answer.
  DECISION_TYPE_MULLIGAN_KEEP = 2;
  // London mulligan after a mulligan: put exactly cards_to_return cards from
  // candidates (= current hand) on the bottom; answer = card_ids (order is
  // bottom-stacking order, first = topmost of the tucked group).
  DECISION_TYPE_MULLIGAN_TUCK = 3;
  // Declare attackers; candidates = legal attacker cards,
  // defender_players = legal defenders; answer = attackers (attacker_card ->
  // defender_player pairs). Empty list = attack with nothing.
  DECISION_TYPE_DECLARE_ATTACKERS = 4;
  // Declare blockers; attacker_cards = declared attackers, candidates = legal
  // blocker cards; answer = blockers (blocker_card -> attacker_card pairs).
  // Empty list = block with nothing.
  DECISION_TYPE_DECLARE_BLOCKERS = 5;
  // Assign an attacker's combat damage; damage_amount = total damage,
  // candidates = remaining blocker cards, defender_players = the defending
  // player slot; answer = damage (card-or-player -> amount). Amounts must sum
  // to damage_amount; the defending player is addressed via the player arm.
  DECISION_TYPE_ASSIGN_COMBAT_DAMAGE = 6;
  // Order blockers for damage assignment; candidates = blockers of one
  // attacker in current order; answer = card_ids in the new order (permutation).
  DECISION_TYPE_ORDER_BLOCKERS = 7;
  // Generic card selection from an effect (discard, sacrifice, fetch, ...);
  // candidates + min/max/optional constraints; answer = card_ids
  // (size in [min, max], empty allowed iff optional).
  DECISION_TYPE_CHOOSE_CARDS = 8;
  // Announce a number (X value, choose-number effects); answer = number_answer
  // within [min_number, max_number].
  DECISION_TYPE_ANNOUNCE = 9;
  // Scry/surveil arrangement; candidates = the top N cards; answer = scry
  // partition (ordered top group / bottom group; bottom = scry-away or
  // surveil-graveyard group). Both groups together must be a permutation of
  // candidates.
  DECISION_TYPE_SCRY_ARRANGE = 10;
  // Choose targets for a spell/ability being cast or resolving;
  // candidates = legal target cards (+ defender_players for player targets);
  // answer = targets (TargetSelection). Size within [min_choices,
  // max_choices]; mandatory requires reaching min_choices.
  DECISION_TYPE_CHOOSE_TARGETS = 11;
  // Choose modes for a spell/ability; mode_options = the mode list; answer =
  // mode option ids via the card_ids arm (IntList), size within
  // [min_choices, max_choices]; repeats only if allow_repeat.
  DECISION_TYPE_CHOOSE_MODE = 12;
  // Choose optional costs (kicker etc.); cost_options = the cost list;
  // answer = cost option ids via the card_ids arm (IntList).
  DECISION_TYPE_OPTIONAL_COSTS = 13;
}

message Option {
  int32 id = 1;                     // stable within this DecisionRequest
  string kind = 2;                  // "play_card" | "activate" | "choose" | "pass" | ...
  string card_name = 3;             // empty if N/A
  repeated string target_names = 4; // chosen targets if any
  string description = 5;           // human-readable
}

// A selectable card: engine id + display name.
message CardCandidate {
  int32 card_id = 1;
  string name = 2;
}

message DecisionRequest {
  int64 game_id = 1;
  int64 decision_id = 2;            // monotonic within the game, starts at 1
  int32 player = 3;                 // acting player slot
  int32 turn = 4;
  string phase = 5;                 // "Main1", "Combat", ...
  DecisionType decision_type = 6;
  string prompt = 7;                // engine question, human-readable
  // --- PRIORITY payload ---
  repeated Option options = 8;
  // --- selection payloads (TUCK, BLOCKERS, DAMAGE, ORDER, CHOOSE_CARDS, SCRY) ---
  repeated CardCandidate candidates = 9;
  int32 min_choices = 10;           // inclusive lower bound on selection size
  int32 max_choices = 11;           // inclusive upper bound on selection size
  bool optional = 12;               // empty selection allowed
  // --- ANNOUNCE payload ---
  int32 min_number = 13;
  int32 max_number = 14;
  // --- combat payloads ---
  repeated int32 defender_players = 15;  // DECLARE_ATTACKERS / ASSIGN_COMBAT_DAMAGE
  repeated int32 attacker_cards = 16;    // DECLARE_BLOCKERS / ASSIGN_COMBAT_DAMAGE
  int32 damage_amount = 17;              // ASSIGN_COMBAT_DAMAGE: total to distribute
  int32 damage_source_card = 18;         // ASSIGN_COMBAT_DAMAGE: the attacking card
  // --- MULLIGAN payload ---
  int32 cards_to_return = 19;            // MULLIGAN_TUCK: exact tuck count
  // --- CHOOSE_TARGETS / CHOOSE_MODE / OPTIONAL_COSTS payload ---
  string spell_description = 20;         // host card + ability text summary
  bool allow_repeat = 21;                // CHOOSE_MODE: repeats allowed
  repeated ModeOption mode_options = 22; // CHOOSE_MODE / OPTIONAL_COSTS options
  bool mandatory = 23;                   // CHOOSE_TARGETS: min_choices required
}

message IntList {
  repeated int32 values = 1;
}

// One attacker -> defender edge. defender_player is a player slot.
message AttackerAssignment {
  int32 attacker_card = 1;
  int32 defender_player = 2;
}

// One blocker -> attacker edge.
message BlockerAssignment {
  int32 blocker_card = 1;
  int32 attacker_card = 2;
}

// Combat damage routed to a card (blocker) or the defending player.
message DamageAssignment {
  oneof target {
    int32 card_id = 1;
    int32 player = 2;   // the defending player slot
  }
  int32 amount = 3;
}

// Scry/surveil partition of the top-N cards into two ordered groups.
message CardPartition {
  repeated int32 top = 1;     // keep on top, in order (first = new top card)
  repeated int32 bottom = 2;  // put away (bottom of library / graveyard)
}

// Wrapper lists: oneof arms must not be repeated, so the combat answers are
// wrapped (same pattern as IntList for card_ids).
message AttackerList { repeated AttackerAssignment values = 1; }
message BlockerList { repeated BlockerAssignment values = 1; }
message DamageList { repeated DamageAssignment values = 1; }

// One mode (CHOOSE_MODE) or optional cost (OPTIONAL_COSTS) option.
message ModeOption {
  int32 id = 1;           // stable within this DecisionRequest
  string description = 2; // engine mode/cost text
}

// Typed target selection: cards and/or players, given order = assignment order.
message TargetSelection {
  repeated int32 card_ids = 1;
  repeated int32 player_slots = 2;   // for player-targeting effects
}

message DecisionSubmit {
  int64 game_id = 1;
  int64 decision_id = 2;            // must equal the outstanding DecisionRequest.decision_id
  // Exactly one arm, matching the outstanding DecisionType.
  oneof answer {
    int32 option_id = 3;            // PRIORITY
    bool boolean_answer = 4;        // MULLIGAN_KEEP
    IntList card_ids = 5;           // MULLIGAN_TUCK / ORDER_BLOCKERS / CHOOSE_CARDS
    int64 number_answer = 6;        // ANNOUNCE
    AttackerList attackers = 7;    // DECLARE_ATTACKERS (wrapper)
    BlockerList blockers = 8;      // DECLARE_BLOCKERS (wrapper)
    DamageList damage = 9;         // ASSIGN_COMBAT_DAMAGE (wrapper)
    CardPartition scry = 10;                      // SCRY_ARRANGE
    TargetSelection targets = 11; // CHOOSE_TARGETS
  }
}

message GameEvent {
  int64 seq = 1;                    // per-game monotonic, starts at 1; defines replay identity
  int64 game_id = 2;
  int32 turn = 3;
  string phase = 4;
  string type = 5;                  // normalized vocabulary (see header):
                                    // CardDrawn | LandPlayed | SpellCast | SpellResolved
                                    // | PermanentEntered | PermanentLeftBattlefield
                                    // | CardTapped | CardCounters | PlayerCounters
                                    // | AttachmentMoved | ManaProduced | ManaSpent
                                    // | LifeChanged | PlayerDamaged | CardDamaged
                                    // | AttackersDeclared | BlockersDeclared
                                    // | TriggerOrdered | TurnStarted | Phase | Shuffled
                                    // | Scry | Surveil | Mulligan | SnapshotRestored
                                    // | DecisionTimeout | DecisionGap | GameOver
  int32 player = 6;                 // acting/affected player
  int32 card_id = 7;                // engine card id; 0 = N/A
  string card_name = 8;
  string detail_raw = 9;            // raw log text, preserved verbatim
  int32 old_value = 10;             // counter/life old value (when applicable)
  int32 new_value = 11;             // counter/life new value (when applicable)
  string extra = 12;                // from/to zone names, sa/target/mode descriptions
}

message StepResult {
  repeated GameEvent events = 1;    // convenience: events appended by this step (same buffer as PollEvents)
  bool decision_pending = 2;        // another decision needed immediately
  bool game_over = 3;
}

message PollRequest {
  int64 game_id = 1;
  int64 cursor = 2;                 // last seq seen; 0 = from start
}

message EventBatch {
  repeated GameEvent events = 1;    // all buffered events with seq > cursor, in seq order
  int64 next_cursor = 2;            // seq of last returned event (cursor if none)
  bool game_over = 3;
}

message TypedCounter {
  string type = 1;                  // counter type name (e.g. "+1/+1")
  int32 count = 2;
}

message Permanent {
  int32 id = 1;
  string card_name = 2;
  int32 controller = 3;
  int32 owner = 4;
  bool tapped = 5;
  bool attacking = 6;
  bool blocking = 7;
  map<string, int32> counters = 8;  // DEPRECATED in v6 (kept for wire compat);
                                    // prefer typed_counters
  repeated string attachments = 9;  // names of attached permanents (auras/equipment)
  bool is_token = 10;
  string type_line = 11;
  repeated TypedCounter typed_counters = 12;
  int32 damage = 13;                // damage currently marked
}

message StackEntry {
  int32 stack_index = 1;
  string sa_description = 2;        // spell/ability text
  string card_name = 3;
  int32 controller = 4;
}

// Typed mana pool per player.
message ManaPool {
  int32 white = 1;
  int32 blue = 2;
  int32 black = 3;
  int32 red = 4;
  int32 green = 5;
  int32 colorless = 6;
}

message FullState {
  int64 game_id = 1;
  int32 turn = 2;
  string phase = 3;
  int32 active_player = 4;
  repeated int32 life = 5;
  // Per-player zones. Index = player slot.
  repeated Zone hand = 6;
  repeated Zone battlefield = 7;
  repeated Zone graveyard = 8;
  repeated Zone library = 9;        // top card first; counts only unless revealed
  map<string, int32> mana_pools = 10;  // DEPRECATED in v6; prefer typed_mana_pools
  repeated GameEvent recent_events = 11;
  string state_hash = 12;           // SHA-256 projection; cache key only
  repeated ManaPool typed_mana_pools = 13;  // index = player slot
  repeated StackEntry stack = 14;   // current stack, bottom first
  repeated Zone exile = 15;         // per-player exile zones
  repeated Zone command = 16;       // per-player command zones
  // Flat battlefield listing; Zone.permanents ids (battlefield zone) index
  // into this list. Carries the full Permanent detail (typed counters,
  // damage).
  repeated Permanent battlefield_cards = 17;
}

message Zone {
  repeated CardRef cards = 1;       // for battlefield use Permanent via battlefield zone only
  repeated int32 permanents = 2;    // ids into FullState battlefield listing (battlefield zone only)
}

message CardRef {
  string name = 1;
  int32 count = 2;                  // for library stacks
}

message StateToken { bytes token = 1; int64 game_id = 2; }

message SnapshotResponse {
  StateToken token = 1;
  string state_hash = 2;            // SHA-256 projection; cache key only
}

message RestoreRequest {
  int64 game_id = 1;
  bytes token = 2;
}

// --- v7: scenario injection ------------------------------------------------

// One card in an injected zone.
message CardSpec {
  string name = 1;                    // Forge card name (must resolve uniquely)
  string set = 2;                     // optional set code for disambiguation
  bool tapped = 3;
  bool summoning_sick = 4;
  map<string, int32> counters = 5;    // e.g. {"+1/+1": 2}
  int32 damage = 6;
  bool no_etb_triggers = 7;           // suppress enters-the-battlefield triggers
  int32 id = 8;                       // scenario-assigned id (0 = unspecified)
  int32 attached_to = 9;              // host card id (0 = unattached)
}

// One player's injected state. Repeated CardSpec lists preserve order; for
// `library` the order is the library order (index 0 = top).
message PlayerScenario {
  int32 player = 1;
  int32 life = 2;                     // -1 = leave unchanged
  map<string, int32> mana = 3;        // e.g. {"W": 2, "C": 1}; replaces the pool
  repeated CardSpec battlefield = 4;
  repeated CardSpec hand = 5;
  repeated CardSpec graveyard = 6;
  repeated CardSpec library = 7;
  repeated CardSpec exile = 8;
}

message SetupScenarioRequest {
  int64 game_id = 1;
  repeated PlayerScenario players = 2;
  int32 active_player = 3;            // -1 = leave unchanged
  int32 turn = 4;                     // 0 = leave unchanged
  string phase = 5;                   // empty = leave unchanged
  bool require_outstanding_decision = 6;  // default true (engine parked)
}

message SetupScenarioResponse {
  string state_hash = 1;              // after injection
  int32 applied_events = 2;           // events appended by the injection
}

message GameOver {
  bool over = 1;
  int32 winner = 2;                 // -1 if draw
  string reason = 3;
  Outcome outcome = 4;
}
